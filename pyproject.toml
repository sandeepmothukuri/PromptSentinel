[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptshield"
version = "0.1.0"
description = "Scan LLM prompts and responses for PII, secrets, prompt injection, and jailbreak attempts."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sandeep Mothukuri", email = "sandeep.mothukuris@gmail.com" }]
requires-python = ">=3.9"
keywords = ["llm", "security", "prompt-injection", "pii", "jailbreak", "ai-safety", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
pretty = ["rich>=13.0", "click>=8.0"]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.0",
    "ruff>=0.4.0",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
]

[project.scripts]
promptshield = "promptshield.cli:main"

[project.urls]
Homepage = "https://github.com/sandeepmothukuri/promptshield"
Repository = "https://github.com/sandeepmothukuri/promptshield"
Issues = "https://github.com/sandeepmothukuri/promptshield/issues"

[tool.setuptools.packages.find]
include = ["promptshield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=promptshield --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["promptshield"]
omit = ["promptshield/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 65
omit = ["promptshield/__main__.py", "promptshield/cli.py"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE", "SIM", "RUF"]
ignore = ["E501", "B007", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["examples/", "scripts/", "benchmarks/", "api/", "integrations/"]
