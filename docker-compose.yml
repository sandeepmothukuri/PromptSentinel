version: "3.9"

services:
  promptsentinel-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: promptsentinel:latest
    container_name: promptsentinel-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Optional: Run as CLI scanner
  promptsentinel-cli:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: promptsentinel:latest
    entrypoint: ["python", "-m", "promptsentinel"]
    profiles: ["cli"]
    volumes:
      - ./scan-target:/scan-target:ro
