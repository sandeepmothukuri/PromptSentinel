name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "New Detectors"
    labels: ["detection", "feature"]
  - title: "Bug Fixes"
    labels: ["bug", "fix"]
  - title: "False Negative Fixes"
    labels: ["false-negative"]
  - title: "Documentation"
    labels: ["documentation", "docs"]
  - title: "Maintenance"
    labels: ["dependencies", "chore", "refactor"]

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels: ["breaking-change"]
  minor:
    labels: ["feature", "detection", "enhancement"]
  patch:
    labels: ["bug", "fix", "false-negative", "documentation", "dependencies", "chore"]
  default: patch

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/sandeepmothukuri/promptshield/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
